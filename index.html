<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Echo Mystérieux</title>
<style>
    #startBtn:active {
        background-color: #d1d1d1;
    }
</style>
</head>
<body>
<h1>Parle ici :</h1>
<button id="startBtn">Commencer</button>

<p id="hint" style="color: #666; font-size: 0.9em; margin-top: 10px;">
    <i>Essaye de demander : <span id="example">...</span></i>
</p>

<p id="output" style="font-weight: bold; margin-top: 20px;"></p>

<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const synth = window.speechSynthesis;

const exemplesQuestions = [
    "Est-ce qu'il va pleuvoir aujourd'hui ?",
    "Tu as passé une bonne journée ?",
    "Qu'est-ce qu'on mange ce soir ?",
    "Tu sais où j'ai mis mes clés ?",
    "C'est quand le week-end ?",
    "Pourquoi le bus est toujours en retard ?",
    "Tu penses quoi de ma coiffure ?",
    "Où est passé le chat ?"
];

const reponses = {
    pourquoi: ["parce que le beurre a fondu.", "car l'escalier est en panne.", "à cause du niveau d'humidité.", "parce que le castor refuse."],
    quand: ["seulement le troisième mardi du mois.", "quand le chat sera d'accord.", "juste après la cuisson du riz.", "jamais sans mon autorisation écrite."],
    ou: ["probablement sous le tapis du salon.", "dans le tiroir à sauce samouraï.", "exactement là où tu n'es pas.", "au fond du micro-ondes."],
    general: ["uniquement avec des gants de boxe.", "tout dépend de la météo en Lozère.", "oui, mais sans les pépins.", "c'est une question de plomberie.", "seulement si tu portes un chapeau."]
};

const intros = ["Écoute, ", "En réalité, ", "Je dirais que ", "C'est simple : ", "La vérité, c'est que "];

let sacs = {
    questions: [],
    intros: [],
    pourquoi: [],
    quand: [],
    ou: [],
    general: []
};

function remplirSac(nomDuSac, sourceOriginale) {
    sacs[nomDuSac] = [...sourceOriginale].sort(() => Math.random() - 0.5);
}

// Fonction pour piocher dans un sac
function piocher(nomDuSac, sourceOriginale) {
    if (sacs[nomDuSac].length === 0) {
        remplirSac(nomDuSac, sourceOriginale);
    }
    return sacs[nomDuSac].pop();
}

if (!SpeechRecognition) {
    alert("Ton navigateur ne supporte pas la reconnaissance vocale.");
} else {
    const recognition = new SpeechRecognition();
    recognition.lang = 'fr-FR';

    const startBtn = document.getElementById('startBtn');
    const output = document.getElementById('output');
    const exampleSpan = document.getElementById('example');

    function updateExample() {
        exampleSpan.textContent = `"${piocher('questions', exemplesQuestions)}"`;
    }

    updateExample();

    startBtn.addEventListener('click', () => {
        output.textContent = "Je vous écoute...";
        recognition.start();
    });

    recognition.onresult = (event) => {
        const question = event.results[0][0].transcript.toLowerCase();
        
        let type = 'general';
        if (question.includes("pourquoi")) type = 'pourquoi';
        else if (question.includes("quand")) type = 'quand';
        else if (question.includes("où") || (question.includes("ou") && question.includes("est"))) type = 'ou';

        const intro = piocher('intros', intros);
        const reponse = piocher(type, reponses[type]);
        
        const phraseFinale = intro + reponse;
        output.textContent = phraseFinale;

        const utter = new SpeechSynthesisUtterance(phraseFinale);
        utter.lang = 'fr-FR';
        utter.pitch = 0.9;
        utter.rate = 0.95;
        
        synth.cancel();
        synth.speak(utter);
        
        updateExample();
    };

    recognition.onerror = () => { output.textContent = "Réessaye."; };
}
</script>
</body>
</html>
