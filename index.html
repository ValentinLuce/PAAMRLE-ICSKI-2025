<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Echo Mystérieux</title>
<style>
    #startBtn:active {
        background-color: #d1d1d1;
    }
</style>
</head>
<body>
<h1>Parle ici :</h1>
<button id="startBtn">Commencer</button>

<p id="hint" style="color: #666; font-size: 0.9em; margin-top: 10px;">
    <i>Essaye de demander : <span id="example">"Pourquoi le bus est toujours en retard ?"</span></i>
</p>

<p id="output" style="font-weight: bold; margin-top: 20px;"></p>

<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const synth = window.speechSynthesis;

const exemplesQuestions = [
    "Est-ce qu'il va pleuvoir aujourd'hui ?",
    "Tu as passé une bonne journée ?",
    "Qu'est-ce qu'on mange ce soir ?",
    "Tu sais où j'ai mis mes clés ?",
    "C'est quand le week-end ?",
    "Pourquoi le bus est toujours en retard ?"
];

// Dictionnaires de réponses par type de question pour simuler une conversation
const reponses = {
    pourquoi: [
        "parce que le beurre a fondu.",
        "car l'escalier est en panne.",
        "à cause du niveau d'humidité.",
        "parce que le castor refuse."
    ],
    quand: [
        "seulement le troisième mardi du mois.",
        "quand le chat sera d'accord.",
        "juste après la cuisson du riz.",
        "jamais sans mon autorisation écrite."
    ],
    ou: [
        "probablement sous le tapis du salon.",
        "dans le tiroir à sauce samouraï.",
        "exactement là où tu n'es pas.",
        "au fond du micro-ondes."
    ],
    general: [
        "uniquement avec des gants de boxe.",
        "tout dépend de la météo en Lozère.",
        "oui, mais sans les pépins.",
        "c'est une question de plomberie.",
        "seulement si tu portes un chapeau."
    ]
};

const intros = ["Écoute, ", "En réalité, ", "Je dirais que ", "C'est simple : ", "La vérité, c'est que "];

let lastQuestionIndex = -1;
let lastResponse = "";

if (!SpeechRecognition) {
    alert("Ton navigateur ne supporte pas la reconnaissance vocale.");
} else {
    const recognition = new SpeechRecognition();
    recognition.lang = 'fr-FR';

    const startBtn = document.getElementById('startBtn');
    const output = document.getElementById('output');
    const exampleSpan = document.getElementById('example');

    function updateExample() {
        let rand;
        do { rand = Math.floor(Math.random() * exemplesQuestions.length); } 
        while (rand === lastQuestionIndex);
        lastQuestionIndex = rand;
        exampleSpan.textContent = `"${exemplesQuestions[rand]}"`;
    }

    startBtn.addEventListener('click', () => {
        output.textContent = "Je vous écoute...";
        recognition.start();
    });

    recognition.onresult = (event) => {
        const question = event.results[0][0].transcript.toLowerCase();
        let listeChoisie = reponses.general;

        // Semblant de logique : on détecte le type de question
        if (question.includes("pourquoi")) listeChoisie = reponses.pourquoi;
        else if (question.includes("quand")) listeChoisie = reponses.quand;
        else if (question.includes("où") || question.includes("ou est")) listeChoisie = reponses.ou;

        const intro = intros[Math.floor(Math.random() * intros.length)];
        
        let nouvelleReponse;
        do {
            nouvelleReponse = listeChoisie[Math.floor(Math.random() * listeChoisie.length)];
        } while (nouvelleReponse === lastResponse);
        
        lastResponse = nouvelleReponse;
        const phraseFinale = intro + nouvelleReponse;
        output.textContent = phraseFinale;

        const utter = new SpeechSynthesisUtterance(phraseFinale);
        utter.lang = 'fr-FR';
        utter.pitch = 0.9;
        utter.rate = 0.95;
        
        synth.cancel();
        synth.speak(utter);
        updateExample();
    };

    recognition.onerror = () => { output.textContent = "L'Oracle n'a pas entendu. Réessayez."; };
}
</script>
</body>
</html>
