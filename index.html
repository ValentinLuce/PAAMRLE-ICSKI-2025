<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Echo Mystérieux</title>
<style>
    /* On garde le bouton tel quel, on ajoute juste le changement de couleur au clic */
    #startBtn:active {
        background-color: #d1d1d1; /* Devient gris quand on appuie */
    }
</style>
</head>
<body>
<h1>Parle ici :</h1>
<button id="startBtn">Commencer</button>

<p id="hint" style="color: #666; font-size: 0.9em; margin-top: 10px;">
    <i>Essaye de demander : <span id="example">"Est-ce qu'il va pleuvoir aujourd'hui ?"</span></i>
</p>

<p id="output" style="font-weight: bold; margin-top: 20px;"></p>

<script>
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const synth = window.speechSynthesis;

const exemplesQuestions = [
    "Est-ce qu'il va pleuvoir aujourd'hui ?",
    "Tu as passé une bonne journée ?",
    "Qu'est-ce qu'on mange ce soir ?",
    "Tu sais où j'ai mis mes clés ?",
    "C'est quand le week-end ?",
    "Tu penses quoi de ma nouvelle coupe de cheveux ?",
    "Pourquoi le bus est toujours en retard ?"
];

const reponsesAbsurdes = [
    "seulement si le chat est d'accord.",
    "parce que le beurre a fondu.",
    "uniquement avec des gants de boxe.",
    "tout dépend de la sauce samouraï.",
    "jamais sans mon autorisation écrite.",
    "c'est écrit sur le paquet de riz.",
    "a cause du niveau d'humidité.",
    "oui, mais sans les pépins.",
    "non, car le castor refuse.",
    "seulement le troisième mardi du mois.",
    "c'est une question de plomberie.",
    "probablement sous le tapis du salon.",
    "il faut demander au micro-ondes.",
    "seulement si tu portes un chapeau.",
    "parce que l'escalier est en panne."
];

const intros = [
    "Écoute, ", 
    "En réalité, ", 
    "Je dirais que ", 
    "Pour être franc, ", 
    "C'est simple : ", 
    "La vérité, c'est que "
];

if (!SpeechRecognition) {
    alert("Ton navigateur ne supporte pas la reconnaissance vocale.");
} else {
    const recognition = new SpeechRecognition();
    recognition.lang = 'fr-FR';

    const startBtn = document.getElementById('startBtn');
    const output = document.getElementById('output');
    const exampleSpan = document.getElementById('example');

    function updateExample() {
        const rand = Math.floor(Math.random() * exemplesQuestions.length);
        exampleSpan.textContent = `"${exemplesQuestions[rand]}"`;
    }

    startBtn.addEventListener('click', () => {
        output.textContent = "Je vous écoute...";
        recognition.start();
    });

    recognition.onresult = (event) => {
        const intro = intros[Math.floor(Math.random() * intros.length)];
        const reponse = reponsesAbsurdes[Math.floor(Math.random() * reponsesAbsurdes.length)];
        
        const phraseFinale = intro + reponse;
        output.textContent = phraseFinale;

        const utter = new SpeechSynthesisUtterance(phraseFinale);
        utter.lang = 'fr-FR';
        utter.pitch = 0.9;
        utter.rate = 0.95;
        
        synth.cancel();
        synth.speak(utter);
        
        updateExample();
    };

    recognition.onerror = () => {
        output.textContent = "L'Oracle n'a pas entendu. Réessayez.";
    };
}
</script>
</body>
</html>
